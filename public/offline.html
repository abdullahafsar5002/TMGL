<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F17">
  <title>TMGL - Offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; background: #0B0F17; color: #F9FAFB; font-family: system-ui, -apple-system, sans-serif; }
    main { width: 100%; max-width: 25rem; text-align: center; }
    .mark { width: 4rem; height: 4rem; margin: 0 auto 1.5rem; display: grid; place-items: center; border: 1px solid #D4AF37; border-radius: 1rem; color: #D4AF37; font-size: 1.5rem; font-weight: 800; }
    h1 { margin: 0 0 .5rem; font-size: 1.35rem; }
    p { margin: 0 0 1.5rem; color: #D1D5DB; line-height: 1.6; }
    button { min-height: 2.75rem; border: 0; border-radius: .6rem; padding: .75rem 1.25rem; background: #D4AF37; color: #0B0F17; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    footer { margin-top: 2rem; color: #9CA3AF; font-size: .75rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">TM</div>
    <h1>You're offline</h1>
    <p>Some TMGL features need a connection. Queued scores remain on this device and sync when you reconnect.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
    <footer>Toruk Maktu Golf League</footer>
  </main>
</body>
</html>
